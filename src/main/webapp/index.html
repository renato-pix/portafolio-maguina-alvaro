<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Portafolio - Bienvenidos a la programación</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(-45deg, #0f2027, #203a43, #2c5364, #141e30);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
            color: #ffffff;
            min-height: 100vh;
            padding: 20px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .hero {
            text-align: center;
            margin: 30px 0 50px 0;
        }

        .hero h1 {
            font-size: 2.2rem;
            margin-bottom: 8px;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        .sub-inicio {
            font-size: 1.2rem;
            color: #00d2ff;
            font-weight: 600;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .grid-semanas {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 24px;
        }

        .card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .card h3 {
            color: #00d2ff;
            font-size: 1.3rem;
            margin-bottom: 6px;
        }

        .btn {
            display: block;
            text-align: center;
            background-color: #00d2ff;
            color: #0f2027;
            padding: 10px 14px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
            transition: transform 0.2s, background-color 0.2s;
        }

        .btn:hover {
            background-color: #80e5ff;
            transform: translateY(-2px);
        }

        .btn-alt {
            background-color: transparent;
            color: #ffffff;
            border: 1px solid #00d2ff;
        }

        .btn-alt:hover {
            background-color: rgba(0, 210, 255, 0.15);
        }

        .btn-pendiente {
            border-color: #ffb703;
            color: #ffb703;
        }

        .btn-pendiente:hover {
            background-color: rgba(255, 183, 3, 0.15);
        }
    </style>
</head>
<body>

    <header class="hero">
        <h1>Bienvenidos a la programación</h1>
        <p class="sub-inicio">Inicio</p>
    </header>

    <main class="container">
        <div class="grid-semanas" id="gridSemanas"></div>
    </main>

    <script>
        const gridSemanas = document.getElementById('gridSemanas');
        
        for (let i = 1; i <= 16; i++) {
            const numFormateado = String(i).padStart(2, '0');
            
            // Apunta a las subcarpetas del repositorio principal del portafolio
            const githubUrl = `https://github.com/renato-pix/portafolio-maguina-alvaro`;

            let segundoBoton = '';

            if (i === 1) {
                segundoBoton = '';
            } else if (i === 2) {
                const infografiaUrl = `semana-${numFormateado}/infografia.pdf`;
                segundoBoton = `<a href="${infografiaUrl}" target="_blank" class="btn btn-alt">El archivo al hacer la infografía</a>`;
            } else {
                segundoBoton = `<a href="#" class="btn btn-alt btn-pendiente">Pendiente (Entregado y No Entregado)</a>`;
            }

            const tarjeta = `
                <div class="card">
                    <h3>Semana ${i}</h3>
                    <a href="${githubUrl}" target="_blank" class="btn">Archivo subir en el github</a>
                    ${segundoBoton}
                </div>
            `;

            gridSemanas.innerHTML += tarjeta;
        }
    </script>
</body>
</html>
